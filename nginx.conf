worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker's embedded DNS. Resolving container names at request time (via a
    # variable in proxy_pass) means nginx will start even if the upstream
    # containers aren't running yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Port 3000 -> frontend container ---
    server {
        listen 3000;
        server_name _;

        location / {
            set $upstream_frontend http://frontend:3000;
            proxy_pass $upstream_frontend;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (e.g. dev-server HMR)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # --- Port 3001 -> backend container ---
    server {
        listen 3001;
        server_name _;

        location / {
            set $upstream_backend http://backend:3001;
            proxy_pass $upstream_backend;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
